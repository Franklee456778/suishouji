<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随手记</title>
  </head>
  <body>
    <div id="app">
      <!-- 左栏：文件夹 -->
      <aside id="sidebar" class="pane">
        <div class="pane-header">
          <span class="app-title">随手记</span>
          <button id="sort-folders" class="icon-btn sort-btn" title="文件夹排序"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 12.5v-9"/><path d="M4 6l2.5-2.5L9 6"/><path d="M13.5 7.5v9"/><path d="M11 14l2.5 2.5L16 14"/></svg></button>
        </div>
        <nav id="folder-list" class="folder-list"></nav>
        <button id="add-folder" class="ghost-btn">＋ 新建文件夹</button>
      </aside>

      <!-- 中栏：笔记列表 -->
      <section id="note-pane" class="pane">
        <div class="pane-header">
          <button id="toggle-sidebar" class="icon-btn sidebar-toggle" title="收起/展开侧栏（⌘\）">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <line x1="9" y1="4" x2="9" y2="20"/>
            </svg>
          </button>
          <span id="note-pane-title">全部笔记</span>
          <button id="sort-notes" class="icon-btn sort-btn" title="笔记排序"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 12.5v-9"/><path d="M4 6l2.5-2.5L9 6"/><path d="M13.5 7.5v9"/><path d="M11 14l2.5 2.5L16 14"/></svg></button>
          <button id="add-note" class="icon-btn" title="新建笔记（⌘N）"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.2 3.3a1.8 1.8 0 0 1 2.5 2.5L7.4 15.1l-3.4 1 1-3.4z"/><line x1="12.8" y1="4.7" x2="15.3" y2="7.2"/></svg></button>
          <button id="empty-trash" class="text-btn" title="清空回收站" style="display:none">清空</button>
        </div>
        <ul id="note-list" class="note-list"></ul>
      </section>

      <!-- 右栏：编辑区 -->
      <main id="editor-pane" class="pane">
        <div id="toolbar" class="toolbar"></div>
        <div id="find-bar" class="find-bar">
          <input id="find-input" class="find-input" type="text" placeholder="在本笔记中查找" />
          <span id="find-count" class="find-count">0/0</span>
          <button id="find-prev" class="find-btn" title="上一个（⇧⏎）"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4.5"/><path d="M5.5 9L10 4.5 14.5 9"/></svg></button>
          <button id="find-next" class="find-btn" title="下一个（⏎）"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v11.5"/><path d="M14.5 11L10 15.5 5.5 11"/></svg></button>
          <button id="find-close" class="find-btn" title="关闭（Esc）"><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5.5" y1="5.5" x2="14.5" y2="14.5"/><line x1="14.5" y1="5.5" x2="5.5" y2="14.5"/></svg></button>
        </div>
        <div id="editor-scroll" class="editor-scroll">
          <input id="title-input" class="title-input" placeholder="标题" />
          <div id="editor"></div>
        </div>
        <div id="editor-footer" class="editor-footer"></div>
        <div id="empty-state" class="empty-state">选择或新建一条笔记</div>
        <div id="lock-screen" class="lock-screen">
          <div class="lock-box">
            <div class="lock-emoji"><svg viewBox="0 0 20 20" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8.5" width="12" height="8.5" rx="2"/><path d="M7 8.5V6a3 3 0 0 1 6 0v2.5"/><circle cx="10" cy="12.7" r="1"/></svg></div>
            <div class="lock-text">此笔记已加密</div>
            <input id="lock-pw" type="password" class="lock-input" placeholder="输入密码查看" />
            <div id="lock-err" class="lock-err"></div>
            <button id="lock-unlock-btn" class="lock-unlock-btn">解锁查看</button>
            <button id="lock-touchid-btn" class="lock-touchid-btn" style="display:none">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 7.2A7 7 0 0 1 10 3.2a7 7 0 0 1 6.6 4"/><path d="M6.6 16.4A9 9 0 0 0 6 12a4 4 0 0 1 8 0c0 1.6-.2 3-.6 4.4"/><path d="M9 16.8c-.3-1.5-.4-3.1-.4-4.8a1.4 1.4 0 0 1 2.8 0c0 1.7-.1 3.3-.4 4.8"/></svg> 用 Touch ID 解锁
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="context-menu"></div>

    <!-- 撤销提示 -->
    <div id="toast" class="toast"></div>

    <!-- 应用内弹窗 -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal">
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-message" class="modal-message"></div>
        <div id="modal-fields"></div>
        <div id="modal-error" class="modal-error"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="modal-btn">取消</button>
          <button id="modal-ok" class="modal-btn modal-ok">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
