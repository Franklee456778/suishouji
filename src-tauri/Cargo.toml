[package]
name = "app"
version = "1.0.0"
description = "随手记：本地笔记，系统沙盒内运行，不联网"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"

# macOS 27 (Darwin 27) 的 strip 会把 dylib 的 LINKEDIT 字符串池弄得不对齐，
# 新版 dyld 拒绝 dlopen（构建时卡在过程宏 sqlx_macros，报 "mis-aligned
# LINKEDIT string pool"）。build-override 关不掉过程宏的 strip，只能整个
# release profile 关 strip。代价是二进制不再剥符号、体积略增；换取能在本机
# 出包。日后系统/命令行工具修复此链接器问题后可移除本段恢复瘦身。
[profile.release]
strip = false
